    <section class="contact">
        <div class="contact-container">
            <h2>Get in Touch</h2>
            <div class="contact-wrapper">
                <div class="contact-form">
                    <h3>Send Me A Message</h3>


                    <div class="form-group">
                        <input type="text" name="name" placeholder="Name" id="n1" />
                    </div>
                    <div class="form-group">
                        <input type="text" name="email" placeholder="Email" id="e1" />
                    </div>
                    <div class="form-group">
                        <input type="text" name="subject" placeholder="Subject" id="s1" />
                    </div>
                    <div class="form-group">
                        <textarea name="message" placeholder="Message" id="m1"></textarea>
                    </div>
                    <div class="but">
                        <button type="submit" value="submit" onclick="Message_sent()">Send Message</button>
                    </div>

                </div>
            </div>
        </div>
    </section>
